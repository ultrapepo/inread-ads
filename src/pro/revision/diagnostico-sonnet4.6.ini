Análisis completo — IntextManager / gexp-intext
1. Comparativa de logs random1=5 vs random1=6
random1=5 → variante test-b
Los márgenes de intersección son más agresivos (fetch mucho antes, render más cercano). El resultado en los logs es que el sistema llega al render con la subasta ya expirada: se ve loading_phase_fetch_expired con pendingAgeMs: 10001 superando el maxFetchToRenderMs: 8000, lo que dispara un loading_pending_auction_expired_restart_marked y relanza toda la subasta desde cero ya con el slot casi en pantalla. Eso añade ~7–10 segundos extra antes de que arranque el vídeo y es un problema estructural: en test-b el fetch se lanza muy pronto pero el render se retrasa (sin timer, solo por intersección), por lo que si el usuario no scrollea rápido, la subasta caduca. En este log ocurre exactamente así.
random1=6 → variante control
El control usa maxDelayMs: 1500 en gexp-intext, lo que significa que aunque el usuario no scrolle hasta el render margin, el slot se renderiza igualmente tras 1,5 s de espera tras el fetch. En el log se ve trigger: "timer" en lugar de render-intersection, y el auction_to_request_winner_video baja a 1473 ms (frente a los ~7708 ms del test-b). El adstart aparece a los 16,5 s pero eso es porque hay un vídeo de contenido corriendo en paralelo (el de la Amazon DSP se ve en los VPAID logs); el player de IMA no compete sino que espera su turno. La variante control funciona claramente mejor en tiempos.
Diferencia clave de comportamiento entre variantes:

test-b: sin timer, subasta caduca si el usuario no llega al render margin rápido → doble subasta, retraso acumulado.
control: timer de 1,5 s garantiza render aunque el usuario esté por encima → flujo limpio.


2. Bug: slot "fantasma" con "Recuperando anuncio" al finalizar el vídeo
Causa raíz identificada en el código de refresh_prepare_video_container (línea ~7550):
Cuando el vídeo termina, onVideoEnded llama a waterfall.startAuction("refresh"). Dentro del prepare de esa nueva subasta, el código hace dos cosas a la vez en el DOM que crean la ilusión de dos slots:

El video wrapper (gexp-intext-video) se mantiene visible con su loader "Recuperando anuncio" activado (loaderVideo.style.display = "flex") y se le aplica altura y is-open.
El display wrapper (gexp-intext) se oculta a display:none, height:0, opacity:0.

El problema es que ambos wrappers están en el DOM uno encima del otro (se insertan así en la inicialización: primero displayWrapper, luego videoWrapper justo después con insertBefore(videoWrapper, displayWrapper.nextSibling)). Al hacer el refresh del display post-vídeo, en showDisplay se llama a ensureSingleVisibleIntextSurface("display", ...) que oculta el videoContainer, pero antes de que eso ocurra hay una ventana de tiempo donde:

El videoContainer tiene is-open y display:block (con loader "Recuperando anuncio").
Y simultáneamente, cuando se recrea el displayWrapper con createWrapperNode y se reinserta con insertBefore(slotEl, videoEl), queda por encima del videoEl.
Durante los ~100ms del sentinel de house lineitem, ambos están visibles momentáneamente.

En los logs se confirma: tras AD_END → VIDEO_START → VIDEO_PLAY, el sistema entra en refresh_prepare_video_container, pone el videoEl visible con el loader, y cuando el nuevo display llega (FILL ✅), en showDisplay se oculta el video… pero solo después de que el display ya es visible. Ese instante de solape es el segundo slot que ves.
La solución está en garantizar que el videoContainer se oculte antes de mostrar/insertar el displayWrapper en el refresh post-vídeo, no después. En showDisplay el videoContainer.close({destroy: true}) ya está al final del método, pero el ensureSingleVisibleIntextSurface("display", ...) se llama antes de hacer container.open(). La ventana de solapamiento viene de que refresh_prepare_video_container deja el videoEl visible con el loader hasta que showDisplay lo cierra, y si el display llega rápido (house sentinel = 100ms) ambos coinciden. La corrección sería: en el prepare del ciclo de display (no video), ocultar el videoContainer inmediatamente sin esperar a showDisplay:
js// En refresh_prepare_video_container para modo display:
// ANTES de abrir el displayEl, cerrar el videoEl
if (videoEl) {
  videoEl.style.display = "none";
  videoEl.classList.remove("is-open");
}
O alternativamente, en showDisplay mover el videoContainer.close() antes del container.open() y del slotDoc.style.display = "block".

3. Bug: flash/parpadeo al cargar formatos especiales (billboard 970×250)
Causa raíz identificada en applyDisplayRenderLayout y showDisplay:
Para formatos estándar (300×250, 300×300, 300×600) el slot wrapper ya existe, tiene altura mantenida mediante display_refresh_preserved_height (345 o 600 según lockedHeight), y simplemente se muestra con display:block. No hay destrucción de DOM, solo se cambia el contenido del iframe via GPT refresh.
Para wide-medium-special (970×250, 980×250) el flujo es diferente: cuando llega el slotRenderEnded con ese tamaño, applyDisplayRenderLayout detecta specialProfile.isSpecial = true y aplica un transform: scale(0.3381) al iframe, cambia display: flex, justifyContent: center, etc. El problema es que en el ciclo de destroyDisplayForRetry, el wrapper se destruye y recrea (createWrapperNode) si no existe, o se resetea con altura 0 y display:none. Cuando el nuevo anuncio llega como 970×250 por primera vez, el slot pasa por este estado:

destroyDisplayForRetry → height=345, display=none (preservado por lock).
GPT refresh → espera slotRenderEnded.
showDisplay → container.open() → display=block, opacity=1 → el wrapper aparece con el estado anterior (sin transform especial aún).
applyDisplayRenderLayout aplica el transform scale y flex → transición visual brusca.

El flash ocurre porque el wrapper se hace visible en el paso 3 antes de que en el paso 4 se apliquen los estilos de layout especial. Para los estándar esto no importa porque el iframe ya tiene el tamaño correcto. Pero para special, el iframe mide 970px sin escalar durante ese breve instante → se ve como un "destello" antes de que el scale lo comprima.
La solución es aplicar display:none o visibility:hidden al wrapper hasta que applyDisplayRenderLayout complete su trabajo cuando el perfil sea especial:
js// En showDisplay, antes de container.open():
if (potentiallySpecial) {
  slotDoc.style.visibility = "hidden"; // oculto pero ocupa espacio (no hay reflow)
}
// ... applyDisplayRenderLayout()
// ... después:
slotDoc.style.visibility = "";
O más simple: en showDisplay, no hacer slotDoc.style.display = "block" hasta después de applyDisplayRenderLayout. Actualmente el código abre el container, pone display:block, y luego llama a applyDisplayRenderLayout. Para special creatives ese orden debería invertirse:
js// Actual (problemático para special):
this.container.open(this.lockedHeight);
slotDoc.style.display = "block";
slotDoc.style.opacity = "1";
this.applyDisplayRenderLayout(slotDoc, { ... });

// Corrección propuesta:
// Determinar si es special ANTES de abrir
const tempSpecialProfile = this.getDisplaySpecialCreativeProfile(renderSize.gamWidth, renderSize.gamHeight);
if (tempSpecialProfile.isSpecial) {
  slotDoc.style.visibility = "hidden"; // reserva espacio sin mostrar contenido
}
this.container.open(this.lockedHeight);
slotDoc.style.display = "block";
slotDoc.style.opacity = "1";
this.applyDisplayRenderLayout(slotDoc, { ... });
if (tempSpecialProfile.isSpecial) {
  slotDoc.style.visibility = ""; // revela ya con transform aplicado
}
El transition: none que ya se aplica al slotDoc en showDisplay ayuda pero no es suficiente porque el problema no es de CSS transition sino de que el elemento es visible con estilos incorrectos durante el tiempo entre display:block y applyDisplayRenderLayout.

